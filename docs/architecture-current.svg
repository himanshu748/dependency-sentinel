<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
<title id="title">Dependency Sentinel architecture</title><desc id="description">Local application runs Strands with read-only tools. Qwen on Modal returns typed advice. Deterministic application code validates advice and retains human approval and storage.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#315cb0" stroke-width="2"/></marker><style>.label{font:600 23px Arial,sans-serif;fill:#162338}.body{font:18px Arial,sans-serif;fill:#415269}.small{font:17px Arial,sans-serif;fill:#415269}.line{fill:none;stroke:#315cb0;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="960" fill="#f4f7fb"/>
<text x="64" y="76" style="font:700 42px Arial,sans-serif;fill:#162338">Dependency Sentinel</text>
<text x="64" y="115" class="body">Agents for Humans / Professional Agents / Current provider architecture</text>
<rect x="40" y="158" width="1520" height="505" rx="20" fill="#eaf0f9" stroke="#bdc9d7"/>
<text x="64" y="200" class="label">Local application and trusted execution boundary</text>
<rect x="64" y="230" width="435" height="116" rx="12" fill="white" stroke="#bdc9d7"/><text x="86" y="268" class="label">React workspace</text><text x="86" y="307" class="body">Owned, trusted Git repository</text>
<rect x="574" y="230" width="452" height="116" rx="12" fill="white" stroke="#bdc9d7"/><text x="596" y="268" class="label">FastAPI + Strands Agent</text><text x="596" y="307" class="body">Read manifest and release evidence</text>
<rect x="1100" y="230" width="435" height="116" rx="12" fill="white" stroke="#bdc9d7"/><text x="1122" y="268" class="label">Application-owned validation</text><text x="1122" y="307" class="body">Stage worktree and run tests</text>
<path class="line" d="M499 288 H574"/><path class="line" d="M1026 288 H1100"/>
<rect x="574" y="454" width="452" height="116" rx="12" fill="white" stroke="#bdc9d7"/><text x="596" y="492" class="label">Human approval</text><text x="596" y="531" class="body">Review evidence, diff and tests</text>
<rect x="1100" y="454" width="435" height="116" rx="12" fill="white" stroke="#bdc9d7"/><text x="1122" y="492" class="label">SQLite + export</text><text x="1122" y="531" class="body">Approved patch and review receipt</text>
<path class="line" d="M1317 346 V401 H800 V454"/><path class="line" d="M1026 512 H1100"/>
<text x="64" y="420" class="body">Tools read evidence; the model cannot</text><text x="64" y="450" class="body">approve or write consequential results.</text>
<text x="64" y="514" class="body">Fresh request context. Typed output.</text><text x="64" y="545" class="body">8 model calls maximum per advisory run.</text>
<text x="64" y="600" class="small">Credentials stay in the backend.</text>
<text x="64" y="633" class="small">UI/API accept loopback hosts only.</text>
<text x="600" y="633" class="small">Public hosting needs separate access controls.</text>
<rect x="40" y="715" width="995" height="165" rx="20" fill="white" stroke="#bdc9d7"/>
<text x="64" y="755" class="label">Private inference: Qwen3-8B on Modal</text>
<text x="64" y="792" class="body">Strands OpenAI-compatible provider → authenticated HTTPS → vLLM</text>
<text x="64" y="825" class="body">One L4 maximum; scales to zero; 512 output tokens per call</text>
<text x="64" y="854" class="small">Opt-in configuration; no automatic fixture fallback. Endpoint availability is separate from deployment code.</text>
<path class="line" d="M548 715 V690 H540 V374 H700 V346"/>
<rect x="1070" y="715" width="490" height="165" rx="20" fill="white" stroke="#bdc9d7"/>
<text x="1095" y="755" class="label">Other explicit modes</text>
<text x="1095" y="792" class="body">Scripted fixtures: offline SDK tests</text>
<text x="1095" y="825" class="body">Bedrock / AgentCore: optional recipes</text>
<text x="1095" y="854" class="small">AgentCore deployment is not claimed.</text>
<text x="64" y="926" class="small">Real Qwen tool and approval workflows verified September 9, 2026. See QWEN-VERIFICATION.md for evidence limits.</text>
</svg>
