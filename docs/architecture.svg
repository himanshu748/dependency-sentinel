ource unchanged</text><path stroke="#225ad8" stroke-width="3" marker-end="url(#arrow)" d="M380 295 V345 M380 430 V480 M380 565 V615 M380 700 V750"/><rect width="600" height="740" x="795" y="140" fill="#edf1f8" stroke="#b4c0d2" rx="20"/><text x="820" y="180" font-size="20" font-weight="700">OPTIONAL AWS ADVISORY PATH</text><rect width="550" height="85" x="820" y="210" fill="#fff" stroke="#ced7da" rx="12"/><text x="840" y="243" font-size="19" font-weight="700">Amazon Bedrock AgentCore Runtime</text><text x="840" y="271" fill="#45565d" font-size="15">IAM / SigV4 · /ping + /invocations · Python ARM64</text><rect width="550" height="85" x="820" y="345" fill="#fff" stroke="#ced7da" rx="12"/><text x="840" y="378" font-size="19" font-weight="700">Strands agent with read-only tools</text><text x="840" y="406" fill="#45565d" font-size="15">Fresh request context; validated structured response</text><rect width="550" height="85" x="820" y="480" fill="#fff" stroke="#ced7da" rx="12"/><text x="840" y="513" font-size="19" font-weight="700">Amazon Bedrock · Nova Micro</text><text x="840" y="541" fill="#45565d" font-size="15">512 output tokens per call; 8-call request ceiling</text><rect width="550" height="85" x="820" y="615" fill="#fff" stroke="#ced7da" rx="12"/><text x="840" y="648" font-size="19" font-weight="700">Scoped execution role + private S3 package</text><text x="840" y="676" fill="#45565d" font-size="15">60-second idle timeout; client stops runtime session</text><rect width="550" height="85" x="820" y="750" fill="#fff5df" stroke="#ced7da" rx="12"/><text x="840" y="783" font-size="19" font-weight="700">Deployment status: NOT deployed</text><text x="840" y="811" fill="#45565d" font-size="15">S3 NotSignedUp; alternate AWS login expired</text><path stroke="#225ad8" stroke-width="3" marker-end="url(#arrow)" d="M1095 295 V345 M1095 430 V480"/><path fill="none" stroke="#225ad8" stroke-dasharray="8 5" stroke-width="3" marker-end="url(#arrow)" d="M690 385 H758 V250 H820"/><text x