<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1040"><title id="title">Dependency Sentinel: deployed hosted architecture</title><desc id="desc">The browser calls an AWS EC2 FastAPI gateway over HTTPS. IAM authenticates calls to AWS AgentCore, where Strands uses Groq model inference with read-only tools. The application validates output, requests human approval, and stores browser-session records. Secrets Manager supplies the provider key to the runtime.</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="none" stroke="#315cb0" stroke-width="2" d="M0 0 L8 4 L0 8"/></marker><style>.label,.title{fill:#152239}.title{font:700 38px Arial}.label{font:700 23px Arial}.body{font:19px Arial;fill:#36475e}.small{font:17px Arial;fill:#526078}.line{fill:none;stroke:#315cb0;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1600" height="1040" fill="#f3f6fb"/><text x="56" y="65" class="title">Dependency Sentinel</text><text x="56" y="104" class="body">Agents for Humans / Professional Agents / Deployed September 10, 2026</text><rect width="1520" height="650" x="40" y="145" fill="#e8eef8" stroke="#b9c8de" rx="18"/><text x="64" y="186" class="label">AWS us-east-1: application and agent boundaries</text><rect width="420" height="136" x="64" y="220" fill="#fff" stroke="#b9c8de" rx="12"/><text x="86" y="259" class="label">React browser workspace</text><text x="86" y="299" class="body">Included owned Python repository</text><text x="86" y="330" class="small">HTTPS + Secure HttpOnly session cookie</text><rect width="430" height="136" x="574" y="220" fill="#fff" stroke="#b9c8de" rx="12"/><text x="596" y="259" class="label">EC2 / FastAPI gateway</text><text x="596" y="299" class="body">Session isolation + request limits</text><text x="596" y="330" class="small">IAM-authenticated runtime invocation</text><rect width="445" height="136" x="1090" y="220" fill="#fff" stroke="#b9c8de" rx="12"/><text x="1112" y="259" class="label">Amazon Bedrock AgentCore</text><text x="1112" y="299" class="body">Strands Agents SDK + read-only tools</text><text x="1112" y="330" class="small">Typed advice returned to the application</text><path d="M484 284 H574" class="line"/><path d="M1004 284 H1090" class="line"/><rect width="420" height="126" x="64" y="450" fill="#fff" stroke="#b9c8de" rx="12"/><text x="86" y="490" class="label">Application-owned validation</text><text x="86" y="532" class="body">Validate candidate; run isolated tests</text><rect width="430" height="126" x="574" y="450" fill="#fff" stroke="#b9c8de" rx="12"/><text x="596" y="490" class="label">Human approval gate</text><text x="596" y="532" class="body">Exact record + explicit decision</text><rect width="445" height="126" x="1090" y="450" fill="#fff" stroke="#b9c8de" rx="12"/><text x="1112" y="490" class="label">Server SQLite + export</text><text x="1112" y="532" class="body">Approved review + patch</text><path d="M790 356 V402 H275 V450" class="line"/><text x="470" y="394" class="small">Validate returned model advice</text><path d="M484 512 H574" class="line"/><path d="M1004 512 H1090" class="line"/><rect width="670" height="115" x="64" y="635" fill="#fff" stroke="#b9c8de" rx="12"/><text x="86" y="673" class="label">AWS Secrets Manager</text><text x="86" y="713" class="body">Runtime role reads the Groq key; no frontend credentials</text><text x="788" y="669" class="body">Model advice cannot approve the final action.</text><text x="788" y="706" class="body">The hosted demo has bounded daily AI usage.</text><text x="788" y="741" class="small">Records belong to a browser session; no account recovery.</text><rect width="1520" height="155" x="40" y="830" fill="#fff" stroke="#b9c8de" rx="18"/><text x="64" y="870" class="label">External model provider: Groq GPT-OSS 20B</text><text x="64" y="909" class="body">AgentCore → Strands OpenAI-compatible provider → authenticated Groq HTTPS endpoint</text><text x="64" y="949" class="small">Groq inference is live. This does not claim Bedrock foundation-model inference access. The old Modal endpoint remains stopped.</text><text x="56" y="1020" class="small">Recorded proof: create → inspect evidence → approve → download. See docs/HOSTED.md and docs/GROQ-VERIFICATION.md.</text></svg>